<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semântica</title>
</head>
<body>
    <header>
        <h1>Semântica HTML</h1>
        <p>Todo o conteúdo de cabeçalho do site, sempre ficará dentro da tag <code>&lt;header&gt</code>;</p>

        <nav>
            <a href="#">Link 1</a>
            <a href="#">Link 2</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Título da minha primeira sessão</h2>
            <p>Texto da minha primeira sessão</p>
        </section>
        <section>
            <h2>Título da minha terceira sessão</h2>
            <p>Texto da minha terceira sessão</p>
        </section>

    </main>

    <footer>
        <p>Meu contato: <strong>123456789</strong></p>
    </footer>

    <article>
        <h3>Artigos</h3>
        <p>Sessão muito usada em blogs</p>
    </article>

    <figure>
        <img src="img/A Natureza da Mordida.jpg" alt="capa A Natureza da Mordida">
        <figcaption>capa do livro A Natureza da Mordida</figcaption>
    </figure>
    
</body>
</html>
