<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>  
    <header>
        <h1>Pesquisa Online</h1>
    </header>

    <section>
        <form action="#" method="get">
            <fieldset>
                <!-- DADOS PESSOAIS  -->

                <legend>Dados Pessoais</legend>

                <label for="name">Nome</label>
                <input id="name" type="text" name="userName" required>
                <br>
                <label for="age">Idade</label>
                <input id="age" type="number" name="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de nascimento</label>
                <input id="birthDate" type="date" name="userbirthDate">
                <br>
                <label for="email">Email</label>
                <input id="email" type="email" name="userEmail" required>
                <br>
                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + número sem espaço ou hífen">
                <br>
                <label for="image">Upload de foto</label>
                <input id="image" type="file" accept="image/*" name="userImage">
                <br>
            </fieldset>

            <fieldset>
                
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>
                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>
                <input id="notInformed" type="radio" name="userGender" value="Prefiro não informar">
                <label for="notInformed">Prefiro não informar</label>

                <br>
                <label for="maritalStatus">Estado civil:</label>
                <select id="maritalStatus" name="userMaritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="casado">União estável</option>
                </select>

                <br>
                <p>Estado: </p>
                <label for="state">Selecione o estado</label>
                <select id="state" name="userState">
                    <option value="notInformed">Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CEs">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

                <br>
                <label for="city">Cidade</label>
                <input id="city" type="text" id="userCity" name="Cidade" autocomplete="address-level2" placeholder="Ex.: Fortaleza" required>

            </fieldset>

            <fieldset>
                <!-- HÁBITOS -->
                 
                <legend>Hábitos</legend>

                <p>Redes Sociais: </p>
                <input id="instagram" type="checkbox" name="social" value="Instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="social" value="Facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="linkdin" type="checkbox" name="social" value="Linkdin">
                <label for="linkdin">Linkdin</label>
                <br>
                <input id="X" type="checkbox" name="social" value="X (antigo Twitter)">
                <label for="X">X (antigo Twitter)</label>
                <br>

                <label for="musicStyle">Estilo musical: </label>
                <input list="styleTypes" id="musicStyle" type="text" name="userMusicStyle">
                <datalist id="styleTypes">
                    <option value="Rock"></option>
                    <option value="Pop"></option>
                    <option value="Samba"></option>
                    <option value="Sertanejo"></option>
                </datalist>
                <br>

                <label for="favoriteColor">Cor favorita: </label>
                <input type="color" name="userFavoriteColor" id="favoriteColor">

            </fieldset>
            
            <button type="submit">Enviar</button>

        </form>
    </section>
    
</body>
</html>
